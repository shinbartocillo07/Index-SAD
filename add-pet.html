<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Pets for Adoption</title>
</head>
<body bgcolor="#fff8e1">
  <center>
    <h1><font color="#b33c00">Add Pets for Adoption</font></h1>

    <form>
      <label>Pet Name:</label><br>
      <input type="text"><br><br>

      <label>Type:</label><br>
      <input type="text"><br><br>

      <label>Age:</label><br>
      <input type="number"><br><br>

      <label>Description:</label><br>
      <textarea rows="4" cols="30"></textarea><br><br>

      <label>Upload Pet Photo:</label><br>
      <input type="file" accept="image/*"><br><br>

      <input type="submit" value="Add Pet">
    </form>

    <br>
    <p><a href="adminpage.html"><font color="#000000">Back to Admin Home</font></a></p>
  </center>
